name: basalt
description: Shared design system and GitHub-release updater for the Basalt Flutter apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.basalt.flutter
        pluginClass: BasaltPlugin
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_400Regular.ttf
          weight: 400
        - asset: fonts/Inter_500Medium.ttf
          weight: 500
        - asset: fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_700Bold.ttf
          weight: 700
